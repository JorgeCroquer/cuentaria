name: Publish rates

on:
  schedule:
    # Every 2 hours, not because rates move that often, but because GitHub's
    # scheduler delays or silently discards runs under load (see #187) — a
    # tight cadence makes a late or dropped run harmless. Minute 10 keeps a
    # slot anchored at Venezuela midnight (04:10 UTC), the anchor ADR-0020
    # §S1-1 relies on. Extra runs are free: the append logic dedupes by
    # (currency, source, observedAt), so a run with no new observations adds
    # zero lines (ADR-0020).
    - cron: '10 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/rates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Download existing feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh release download hits the authenticated API, not the public
          # release-asset CDN behind the browser download URL — the CDN can
          # serve a stale cached copy (observed up to 9h old), which silently
          # truncates the published series on republish. See ticket #178.
          gh release download rates --repo "${{ github.repository }}" \
            --pattern rates.ndjson --output existing.ndjson --clobber \
            || : > existing.ndjson

      - name: Fetch sources and merge
        run: dart run bin/rates.dart existing.ndjson > rates.ndjson

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s rates.ndjson ]; then
            gh release view rates --repo "${{ github.repository }}" \
              || gh release create rates --repo "${{ github.repository }}" \
                   --title "rates" --notes "Append-only exchange rate observations (ADR-0020)."
            gh release upload rates rates.ndjson --repo "${{ github.repository }}" \
              --clobber
          fi

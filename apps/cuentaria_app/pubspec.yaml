name: cuentaria_app
description: "Cuentaria MVP Application Shell"
publish_to: 'none'
version: 1.1.2+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  event_bus:
    path: ../../packages/event_bus
  drift: ^2.31.0
  sqlite3: ^2.9.4
  flutter_secure_storage: ^10.3.1
  sqlcipher_flutter_libs: ^0.6.8
  path_provider: ^2.1.5
  contabilidad:
    path: ../../packages/contabilidad
  shared_kernel:
    path: ../../packages/shared_kernel
  tasas:
    path: ../../packages/tasas
  patrimonio:
    path: ../../packages/patrimonio
  deudas:
    path: ../../packages/deudas
  reportes:
    path: ../../packages/reportes
  backup:
    path: ../../packages/backup
  decimal: ^3.2.4
  google_sign_in: ^6.3.0
  http: ^1.6.0
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
